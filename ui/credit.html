<!DOCTYPE html>
<html>
<head>
    <title>Financing Readiness — Hal SME Co-Pilot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 600px;
            margin: 48px auto;
            padding: 0 20px;
            color: #1a1a1a;
        }
        a.back { font-size: 13px; color: #666; }
        h1 { font-size: 20px; margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

        .card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 20px;
        }

        input[type="file"] { font-size: 14px; margin-bottom: 12px; display: block; }

        button {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #333; }

        #result {
            white-space: pre-wrap;
            background: #f7f7f7;
            border: 1px solid #eee;
            padding: 18px;
            border-radius: 10px;
            margin-top: 24px;
            font-size: 14px;
        }
        #result:empty { display: none; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <a class="back" href="/">&larr; Back to services</a>
    <h1>Financing Readiness Check</h1>
    <p class="subtitle">Upload bank transaction history (CSV) to assess alternative credit readiness.</p>

    <div class="card">
        <p style="font-size:13px; color:#666; margin-top:0;">CSV should have columns: date, description, amount, type (credit/debit). At least 3 months of history recommended.</p>
        <input type="file" id="fileInput" accept=".csv">
        <button onclick="runCreditCheck()">Run Assessment</button>
    </div>

    <div id="result"></div>

    <script>
        async function runCreditCheck() {
            const fileInput = document.getElementById("fileInput");
            const resultDiv = document.getElementById("result");

            if (!fileInput.files.length) {
                resultDiv.textContent = "Please select a CSV file first.";
                return;
            }

            resultDiv.innerHTML = '<span class="loading">Running assessment... this may take 15-30 seconds.</span>';

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch("/run-credit-case", {
                method: "POST",
                body: formData,
            });

            const data = await response.json();
            resultDiv.textContent = data.result;
        }
    </script>
</body>
</html>
